name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node -e "const fs=require('fs'),p=require('path'),cp=require('child_process');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(p.join(d,e.name)):e.name.endsWith('.mjs')?[p.join(d,e.name)]:[]);for(const f of [...walk('src'),...walk('bin'),...walk('test')])cp.execFileSync(process.execPath,['--check',f],{stdio:'inherit'})"
      - name: Self-test
        run: npm test
